name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:js
      - run: npm test
      - run: npm run build:single
      - name: Verify generated single-file build is committed
        run: git diff --exit-code -- virtual-study-room.html
