<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>虚拟自习室 - Virtual Study Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">

  <!-- Background Layer -->
  <div id="bg-layer">
    <div id="bg-image"></div>
    <div id="bg-overlay"></div>
  </div>
  <button id="btn-refresh-bg" title="切换背景">🖼️</button>

  <!-- Audio Context Prompt -->
  <div id="audio-prompt" class="hidden">
    <div class="prompt-inner">
      <span class="prompt-icon">🔔</span>
      <p>点击任意位置开始体验</p>
    </div>
  </div>

  <!-- Main App Container -->
  <div id="app">
    <!-- Top Bar -->
    <header id="topbar">
      <div class="logo">
        <span class="logo-icon">📚</span>
        <span class="logo-text">虚拟自习室</span>
      </div>
      <div class="topbar-actions">
        <button id="btn-stats" class="topbar-btn" title="统计">📊</button>
        <button id="btn-achievements" class="topbar-btn" title="成就">🏆</button>
        <button id="btn-theme" class="topbar-btn" title="切换主题">🌓</button>
        <button id="btn-fullscreen" class="topbar-btn" title="全屏">⛶</button>
      </div>
    </header>

    <!-- Main Content Grid -->
    <main id="main-content">
      <!-- Left: Task Panel -->
      <aside id="task-panel" class="glass-panel">
        <div class="panel-header">
          <h3>📋 今日任务</h3>
          <span id="task-count" class="badge">0</span>
        </div>
        <div id="task-input-area">
          <input type="text" id="task-input" placeholder="添加新任务，按 Enter 确认..." maxlength="200">
          <button id="btn-add-task" class="icon-btn" title="添加">＋</button>
        </div>
        <ul id="task-list" class="scrollable">
          <li class="task-empty">✨ 暂无任务，添加一个吧</li>
        </ul>
        <button id="btn-clear-completed" class="text-btn hidden">清除已完成</button>
      </aside>

      <!-- Center: Pomodoro Timer -->
      <section id="timer-section">
        <div id="timer-container">
          <svg id="timer-ring" viewBox="0 0 200 200">
            <circle class="ring-bg" cx="100" cy="100" r="88"/>
            <circle class="ring-progress" cx="100" cy="100" r="88"/>
          </svg>
          <div id="timer-display">
            <span id="timer-minutes">25</span>
            <span class="timer-sep">:</span>
            <span id="timer-seconds">00</span>
          </div>
          <div id="timer-status-badge">就绪</div>
        </div>
        <div id="timer-label">专注时间</div>
        <div id="timer-controls">
          <button id="btn-start-pause" class="primary-btn">开始专注</button>
          <button id="btn-reset" class="secondary-btn">重置</button>
        </div>
        <div id="session-dots">
          <span class="dot filled"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <div id="mode-selector">
          <button class="mode-btn active" data-work="25" data-break="5">25 + 5</button>
          <button class="mode-btn" data-work="45" data-break="10">45 + 10</button>
          <button class="mode-btn" data-work="50" data-break="10">50 + 10</button>
          <button class="mode-btn" data-work="15" data-break="3">15 + 3</button>
        </div>
        <div id="today-summary">
          <span class="summary-icon">🔥</span>
          <span id="today-focus-time">今日专注: 0 分钟</span>
        </div>
      </section>

      <!-- Right: Info Panel -->
      <aside id="info-panel" class="glass-panel">
        <div class="info-card">
          <div class="info-label">🕐 当前时间</div>
          <div id="current-clock" class="info-value">--:--:--</div>
        </div>
        <div class="info-card">
          <div class="info-label">📅 今日日期</div>
          <div id="current-date" class="info-value">----年--月--日</div>
        </div>
        <div class="info-card">
          <div class="info-label">🔥 连续天数</div>
          <div id="streak-days" class="info-value">0 天</div>
        </div>
        <div class="info-card">
          <div class="info-label">⏱️ 总专注时长</div>
          <div id="total-hours" class="info-value">0 小时</div>
        </div>
        <div id="custom-timer" class="info-card">
          <div class="info-label">⚙️ 自定义时长 (分钟)</div>
          <div class="custom-inputs">
            <label>专注 <input type="number" id="custom-work" min="1" max="120" value="25"></label>
            <label>休息 <input type="number" id="custom-break" min="1" max="60" value="5"></label>
            <button id="btn-apply-custom" class="text-btn">应用</button>
          </div>
        </div>
      </aside>
    </main>

    <!-- Audio Bar -->
    <footer id="audio-bar" class="glass-panel">
      <div class="audio-left">
        <select id="sound-select" class="sound-select">
          <option value="none">🔇 无声音</option>
          <optgroup label="🌿 白噪音">
            <option value="rain">🌧️ 雨声</option>
            <option value="cafe">☕ 咖啡厅</option>
            <option value="fireplace">🔥 篝火</option>
            <option value="ocean">🌊 海浪</option>
            <option value="forest">🌲 森林鸟鸣</option>
            <option value="wind">💨 风声</option>
          </optgroup>
          <optgroup label="🎵 轻音乐">
            <option value="lofi1">🎹 钢琴轻音</option>
            <option value="lofi2">🎸 吉他慢奏</option>
            <option value="lofi3">🎻 大提琴</option>
          </optgroup>
        </select>
        <button id="btn-play-audio" class="icon-btn" title="播放/暂停">▶️</button>
      </div>
      <div class="audio-center">
        <span id="now-playing" class="now-playing">未播放</span>
      </div>
      <div class="audio-right">
        <button id="btn-mute" class="icon-btn" title="静音">🔊</button>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="50" title="音量">
        <span id="volume-label">50%</span>
      </div>
    </footer>
  </div>

  <!-- Stats Modal -->
  <div id="stats-modal" class="modal">
    <div class="modal-backdrop"></div>
    <div class="modal-content glass-panel">
      <div class="modal-header">
        <h2>📊 专注统计</h2>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="stats-summary-row">
          <div class="stat-card">
            <div class="stat-number" id="stat-today-minutes">0</div>
            <div class="stat-label">今日/分钟</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="stat-weekly-hours">0</div>
            <div class="stat-label">本周/小时</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="stat-monthly-hours">0</div>
            <div class="stat-label">本月/小时</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="stat-total-hours-all">0</div>
            <div class="stat-label">总计/小时</div>
          </div>
        </div>
        <div class="charts-grid">
          <div class="chart-container">
            <h4>📅 本周每日时长</h4>
            <canvas id="chart-weekly"></canvas>
          </div>
          <div class="chart-container">
            <h4>📆 本月趋势</h4>
            <canvas id="chart-monthly"></canvas>
          </div>
        </div>
        <div class="heatmap-container">
          <h4>🗓️ 月度专注热力图</h4>
          <div id="heatmap-grid"></div>
          <div class="heatmap-legend">
            <span>少</span>
            <span class="legend-block level-0"></span>
            <span class="legend-block level-1"></span>
            <span class="legend-block level-2"></span>
            <span class="legend-block level-3"></span>
            <span class="legend-block level-4"></span>
            <span>多</span>
          </div>
        </div>
        <button id="btn-export-data" class="secondary-btn">📥 导出数据 (JSON)</button>
      </div>
    </div>
  </div>

  <!-- Achievements Modal -->
  <div id="achievements-modal" class="modal">
    <div class="modal-backdrop"></div>
    <div class="modal-content glass-panel">
      <div class="modal-header">
        <h2>🏆 成就徽章</h2>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="achievements-grid"></div>
      </div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/background.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
